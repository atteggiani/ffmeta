name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .[test]
      # Mule is not on PyPI and Iris is not installed here: those tests skip.
      - run: pytest

  test-mule:
    # Behavioural tests against both Mule variants (seeking / sequential).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: seeking (PR 41)
            repo: https://github.com/atteggiani/mule
            ref: 40-move-buffer-to-component-start
          - name: released 2026.09.1
            repo: https://github.com/MetOffice/mule
            ref: "2026.09.1"
    name: test-mule (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - run: git clone --depth 1 --branch "${{ matrix.ref }}" "${{ matrix.repo }}" "$RUNNER_TEMP/mule"
      - run: pytest tests/test_mule.py tests/test_verify.py
        env:
          PYTHONPATH: ${{ runner.temp }}/mule/mule/lib
